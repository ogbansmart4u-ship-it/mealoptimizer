<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MealOptimizer — Personalized Nutrition for Your Health</title>
    <meta
      name="description"
      content="MealOptimizer builds personalized meal plans and analyzes your food for managing diabetes, hypertension and other conditions — tailored to West African diets."
    />

    <!-- Let search engines index the app -->
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA manifest (installable / add-to-home-screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile / PWA polish -->
    <meta name="theme-color" content="#1f7a8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealOptimizer" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MealOptimizer" />
    <meta property="og:title" content="MealOptimizer — Personalized Nutrition for Your Health" />
    <meta
      property="og:description"
      content="Personalized meal plans and AI food analysis for managing diabetes, hypertension and more — built for West African diets."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MealOptimizer — Personalized Nutrition for Your Health" />
    <meta
      name="twitter:description"
      content="Personalized meal plans and AI food analysis for managing diabetes, hypertension and more — built for West African diets."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Self-heal watchdog. This runs from index.html (always served fresh, never
      part of the hashed bundle), so it can recover a device that is stuck on a
      broken/old service worker or cached bundle — a state a normal hard-refresh
      cannot fix on mobile. If the app has not mounted a few seconds after load,
      it unregisters the service worker, clears caches, and reloads ONCE.
    -->
    <script>
      (function () {
        try {
          var HEAL_KEY = "__mo_selfheal_at";
          window.addEventListener("load", function () {
            setTimeout(function () {
              var root = document.getElementById("root");
              var mounted = root && root.childElementCount > 0;
              var last = 0;
              try { last = Number(sessionStorage.getItem(HEAL_KEY) || 0); } catch (e) {}
              // Only act if the app clearly failed to mount, and not more than once per 60s.
              if (!mounted && Date.now() - last > 60000) {
                try { sessionStorage.setItem(HEAL_KEY, String(Date.now())); } catch (e) {}
                var done = function () { location.reload(); };
                try {
                  var jobs = [];
                  if ("serviceWorker" in navigator) {
                    jobs.push(
                      navigator.serviceWorker.getRegistrations().then(function (rs) {
                        return Promise.all(rs.map(function (r) { return r.unregister(); }));
                      }).catch(function () {})
                    );
                  }
                  if (window.caches && caches.keys) {
                    jobs.push(
                      caches.keys().then(function (ks) {
                        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                      }).catch(function () {})
                    );
                  }
                  Promise.all(jobs).then(done, done);
                } catch (e) { done(); }
              }
            }, 8000);
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
