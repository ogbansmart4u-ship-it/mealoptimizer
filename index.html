<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MealOptimiza — Personalized Nutrition for Your Health</title>
    <meta
      name="description"
      content="MealOptimiza builds personalized meal plans and analyzes your food for managing diabetes, hypertension and other conditions — tailored to West African diets."
    />

        <!-- Google Search Console Domain Verification -->
    <meta name="google-site-verification" content="googleed6668b0bbc89325" />

    <!-- Instant Password Recovery URL Interceptor -->
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          if (hash.indexOf('type=recovery') !== -1 || search.indexOf('type=recovery') !== -1) {
            if (window.location.pathname !== '/reset-password') {
              window.location.replace('/reset-password' + search + hash);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Canonical URL Alignment -->
    <link rel="canonical" href="https://mealoptimiza.com/" />

    <!-- Let search engines index the app -->
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA manifest (installable / add-to-home-screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile / PWA polish -->
    <meta name="theme-color" content="#1f7a8c" />

    <meta name="twitter:title" content="MealOptimiza — Personalized Nutrition for Your Health" />

      name="twitter:description"
      content="Personalized meal plans and AI food analysis for managing diabetes, hypertension and more — built for West African diets."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!--
      Stale-shell recovery. If the entry bundle (a hashed /assets/*.js or *.css)
      fails to load — which happens when a cached index.html points at chunks from
      an OLDER deploy — the page would otherwise stay permanently blank on refresh.
      This capture-phase listener (resource load errors do not bubble) detects that
      failure, clears any service worker + caches, and reloads ONCE to fetch the
      current build. Registered in <head> so it is active before the entry loads.
    -->
    <script>
      (function () {
        var RELOAD_KEY = "__mo_chunk_reload_at";
        var params = new URLSearchParams(window.location.search);
        if (params.has("reset") || params.has("clean") || params.has("purge")) {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) { caches.delete(k); });
            });
          }
          sessionStorage.clear();
          window.location.replace(window.location.pathname);
          return;
        }
        function recover() {
          if (typeof navigator !== "undefined" && !navigator.onLine) {
            return; // NEVER unregister service worker or delete caches when offline!
          }
          var last = 0;
          try { last = Number(sessionStorage.getItem(RELOAD_KEY) || 0); } catch (e) {}
          if (Date.now() - last < 20000) return; // already tried within the last 20s
          try { sessionStorage.setItem(RELOAD_KEY, String(Date.now())); } catch (e) {}
          var done = function () { location.reload(); };
          try {
            var jobs = [];
            if ("serviceWorker" in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}));
            }
            Promise.all(jobs).then(done, done);
          } catch (e) { done(); }
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (!t) return;
          var url = (t.src || t.href || "");
          if ((t.tagName === "SCRIPT" || t.tagName === "LINK") && url.indexOf("/assets/") !== -1) {
            recover();
          }
        }, true);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Self-heal watchdog. This runs from index.html (always served fresh, never
      part of the hashed bundle), so it can recover a device that is stuck on a
      broken/old service worker or cached bundle — a state a normal hard-refresh
      cannot fix on mobile. If the app has not mounted a few seconds after load,
      it unregisters the service worker, clears caches, and reloads ONCE.
    -->
    <script>
      (function () {
        try {
          var HEAL_KEY = "__mo_selfheal_at";
          window.addEventListener("load", function () {
            setTimeout(function () {
              var root = document.getElementById("root");
              var mounted = root && root.childElementCount > 0;
              var last = 0;
              try { last = Number(sessionStorage.getItem(HEAL_KEY) || 0); } catch (e) {}
              // Only act if the app clearly failed to mount while online, and not more than once per 60s.
              if (!mounted && navigator.onLine && Date.now() - last > 60000) {
                try { sessionStorage.setItem(HEAL_KEY, String(Date.now())); } catch (e) {}
                var done = function () { location.reload(); };
                try {
                  var jobs = [];
                  if ("serviceWorker" in navigator) {
                    jobs.push(
                      navigator.serviceWorker.getRegistrations().then(function (rs) {
                        return Promise.all(rs.map(function (r) { return r.unregister(); }));
                      }).catch(function () {})
                    );
                  }
                  if (window.caches && caches.keys) {
                    jobs.push(
                      caches.keys().then(function (ks) {
                        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                      }).catch(function () {})
                    );
                  }
                  Promise.all(jobs).then(done, done);
                } catch (e) { done(); }
              }
            }, 8000);
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
