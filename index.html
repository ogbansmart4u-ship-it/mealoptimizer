<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MealOptimizer — Personalized Nutrition for Your Health</title>
    <meta
      name="description"
      content="MealOptimizer builds personalized meal plans and analyzes your food for managing diabetes, hypertension and other conditions — tailored to West African diets."
    />

    <!-- Let search engines index the app -->
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA manifest (installable / add-to-home-screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile / PWA polish -->
    <meta name="theme-color" content="#1f7a8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealOptimizer" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MealOptimizer" />
    <meta property="og:title" content="MealOptimizer — Personalized Nutrition for Your Health" />
    <meta
      property="og:description"
      content="Personalized meal plans and AI food analysis for managing diabetes, hypertension and more — built for West African diets."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MealOptimizer — Personalized Nutrition for Your Health" />
    <meta
      name="twitter:description"
      content="Personalized meal plans and AI food analysis for managing diabetes, hypertension and more — built for West African diets."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
